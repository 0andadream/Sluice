[package]
name = "sluice-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "On-chain policy gate for the Sluice yield agent"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.5.0"

[dev-dependencies]
near-sdk = { version = "=5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = "symbols"
